# buildswiftlazily repo / discovery config
#
# Copy to config/repos.yaml and edit.
# config/repos.yaml is gitignored so your private slugs stay local.

discovery:
  # List personal repos for the authenticated GitHub user
  mode: personal
  # Max repos to list when refreshing
  max_repos: 100
  # Directory depth when scanning a tree for xcodeproj/xcworkspace
  scan_depth: 4

defaults:
  # Pinned favorite shown first in the PWA (must match a repos[].id below)
  favorite: myapp
  deploy_mode: ota
  configuration: Release

repos:
  # Day-1 target — set your real owner/name (GuideAI is fine if that's your app)
  - id: myapp
    repository: YOUR_ORG_OR_USER/YourApp
    display_name: YourApp
    # Optional overrides once you know them:
    # project_path: .
    # scheme: YourApp
    # bundle_id: com.example.YourApp
    favorite: true
