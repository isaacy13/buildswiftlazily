name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/control-plane/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: API smoke
        working-directory: .
        run: ./scripts/smoke-api.sh
      - name: Script dry-runs
        working-directory: .
        run: |
          chmod +x scripts/*.sh
          ./scripts/test-scripts.sh
          ./scripts/validate-macos.sh
          BSL_BOOTSTRAP_DRY=1 ./scripts/bootstrap.sh
