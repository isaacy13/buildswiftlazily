name: Deploy iOS

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "owner/repo to build (e.g. you/GuideAI)"
        required: true
        type: string
      ref:
        description: "Branch, tag, or SHA"
        required: true
        type: string
        default: main
      project_path:
        description: "Relative path to xcodeproj/xcworkspace directory"
        required: false
        type: string
        default: "."
      scheme:
        description: "Xcode scheme"
        required: true
        type: string
      platform:
        description: "ios | watchos (archive destination)"
        required: false
        type: choice
        options:
          - ios
          - watchos
        default: ios
      configuration:
        description: "Xcode configuration"
        required: false
        type: string
        default: Release
      deploy_mode:
        description: "ota | direct | both | testflight"
        required: true
        type: choice
        options:
          - ota
          - direct
          - both
          - testflight
        default: ota
      title:
        description: "Display name on install page"
        required: false
        type: string
        default: ""

concurrency:
  group: ios-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Prefer a Mac self-hosted runner. Extra `ios` label is optional (see docs/SETUP.md).
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout buildswiftlazily (scripts)
        uses: actions/checkout@v4
        with:
          path: tooling

      - name: Validate inputs
        env:
          REPO: ${{ inputs.repository }}
          REF: ${{ inputs.ref }}
          PROJECT_PATH: ${{ inputs.project_path }}
          SCHEME: ${{ inputs.scheme }}
          CONFIGURATION: ${{ inputs.configuration }}
          PLATFORM: ${{ inputs.platform }}
          TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail
          [[ "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "Invalid repository"; exit 1; }
          [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid ref"; exit 1; }
          [[ "$REF" != *..* ]] || { echo "Invalid ref"; exit 1; }
          [[ "$PROJECT_PATH" =~ ^[A-Za-z0-9._/-]+$ || "$PROJECT_PATH" == "." ]] || { echo "Invalid project_path"; exit 1; }
          [[ "$PROJECT_PATH" != *..* ]] || { echo "Invalid project_path"; exit 1; }
          [[ "$SCHEME" =~ ^[A-Za-z0-9._+\ -]+$ ]] || { echo "Invalid scheme"; exit 1; }
          [[ "$CONFIGURATION" =~ ^[A-Za-z0-9._+-]+$ ]] || { echo "Invalid configuration"; exit 1; }
          [[ "$PLATFORM" == "ios" || "$PLATFORM" == "watchos" || -z "$PLATFORM" ]] || { echo "Invalid platform"; exit 1; }
          # Title may be empty; when set must match scheme-safe charset
          if [[ -n "$TITLE" ]] && [[ ! "$TITLE" =~ ^[A-Za-z0-9._+\ -]+$ ]]; then
            echo "Invalid title"; exit 1
          fi

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.IOS_REPOS_READ_TOKEN || github.token }}
          path: target

      - name: Prepare artifact dir
        id: prep
        run: |
          set -euo pipefail
          AID="$(uuidgen | tr '[:upper:]' '[:lower:]')"
          OUT="$HOME/buildswiftlazily/artifacts/builds/$AID"
          mkdir -p "$OUT"
          echo "artifact_id=$AID" >> "$GITHUB_OUTPUT"
          echo "out_dir=$OUT" >> "$GITHUB_OUTPUT"

      # Pass untrusted workflow_dispatch values only via env — never ${{ inputs.* }}
      # inside shell strings (script-injection).
      - name: Build
        env:
          BSL_TEAM_ID: ${{ secrets.BSL_TEAM_ID || vars.BSL_TEAM_ID }}
          PROJECT_PATH: ${{ inputs.project_path }}
          SCHEME: ${{ inputs.scheme }}
          CONFIGURATION: ${{ inputs.configuration }}
          PLATFORM: ${{ inputs.platform }}
          DEPLOY_MODE: ${{ inputs.deploy_mode }}
          OUT_DIR: ${{ steps.prep.outputs.out_dir }}
        run: |
          set -euo pipefail
          chmod +x tooling/scripts/*.sh
          tooling/scripts/build-ios.sh \
            --root target \
            --project-path "$PROJECT_PATH" \
            --scheme "$SCHEME" \
            --configuration "$CONFIGURATION" \
            --platform "${PLATFORM:-ios}" \
            --out-dir "$OUT_DIR" \
            --mode "$DEPLOY_MODE"

      - name: Direct install
        if: ${{ inputs.deploy_mode == 'direct' || inputs.deploy_mode == 'both' }}
        env:
          OUT_DIR: ${{ steps.prep.outputs.out_dir }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          APP="$(cut -d= -f2- < "$OUT_DIR/app_path.txt")"
          case "$APP" in
            "$OUT_DIR"/*) ;;
            *) echo "App path escapes out_dir"; exit 1 ;;
          esac
          CLASS=phone
          [[ "${PLATFORM:-ios}" == "watchos" ]] && CLASS=watch
          tooling/scripts/install-direct.sh --app "$APP" --device-class "$CLASS"

      - name: Publish OTA
        id: ota
        if: ${{ inputs.deploy_mode == 'ota' || inputs.deploy_mode == 'both' }}
        env:
          BSL_TS_HOST: ${{ secrets.BSL_TS_HOST || vars.BSL_TS_HOST }}
          OUT_DIR: ${{ steps.prep.outputs.out_dir }}
          ARTIFACT_ID: ${{ steps.prep.outputs.artifact_id }}
          TITLE: ${{ inputs.title }}
          SCHEME: ${{ inputs.scheme }}
        run: |
          set -euo pipefail
          IPA="$OUT_DIR/App.ipa"
          if [[ -z "$TITLE" ]]; then TITLE="$SCHEME"; fi
          BID="com.example.app"
          BVER="1"
          if [[ -f "$OUT_DIR/bundle_id.txt" ]]; then
            BID="$(tr -d '\r\n' < "$OUT_DIR/bundle_id.txt")"
            [[ "$BID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "Invalid bundle id from IPA"; exit 1; }
          fi
          if [[ -f "$OUT_DIR/bundle_version.txt" ]]; then
            BVER="$(tr -d '\r\n' < "$OUT_DIR/bundle_version.txt")"
            [[ "$BVER" =~ ^[A-Za-z0-9._+-]+$ ]] || { echo "Invalid bundle version from IPA"; exit 1; }
          fi
          [[ -n "${BSL_TS_HOST:-}" ]] || { echo "Set secret/var BSL_TS_HOST"; exit 1; }
          set +e
          OUT="$(tooling/scripts/serve-ota.sh \
            --ipa "$IPA" \
            --artifact-id "$ARTIFACT_ID" \
            --title "$TITLE" \
            --bundle-id "$BID" \
            --bundle-version "$BVER" \
            --ts-host "$BSL_TS_HOST")"
          STATUS=$?
          set -e
          echo "$OUT"
          INSTALL_URL="$(echo "$OUT" | grep '^INSTALL_URL=' | cut -d= -f2-)"
          echo "install_url=$INSTALL_URL" >> "$GITHUB_OUTPUT"
          exit $STATUS

      - name: Upload TestFlight
        if: ${{ inputs.deploy_mode == 'testflight' }}
        env:
          BSL_ASC_KEY_ID: ${{ secrets.BSL_ASC_KEY_ID }}
          BSL_ASC_ISSUER_ID: ${{ secrets.BSL_ASC_ISSUER_ID }}
          API_PRIVATE_KEYS_DIR: ${{ secrets.BSL_ASC_KEYS_DIR || vars.BSL_ASC_KEYS_DIR }}
          OUT_DIR: ${{ steps.prep.outputs.out_dir }}
        run: |
          set -euo pipefail
          tooling/scripts/upload-testflight.sh --ipa "$OUT_DIR/App.ipa"

      - name: Sweep old artifacts
        if: always()
        run: tooling/scripts/ttl-sweep.sh || true

      - name: Job summary
        if: always()
        env:
          REPO: ${{ inputs.repository }}
          REF: ${{ inputs.ref }}
          SCHEME: ${{ inputs.scheme }}
          DEPLOY_MODE: ${{ inputs.deploy_mode }}
          INSTALL_URL: ${{ steps.ota.outputs.install_url }}
        run: |
          {
            echo "## buildswiftlazily deploy"
            echo ""
            echo "- repository: \`$REPO\`"
            echo "- ref: \`$REF\`"
            echo "- scheme: \`$SCHEME\`"
            echo "- mode: \`$DEPLOY_MODE\`"
            if [[ -n "${INSTALL_URL:-}" ]]; then
              echo "- install: $INSTALL_URL"
            fi
            if [[ "$DEPLOY_MODE" == "testflight" ]]; then
              echo "- TestFlight: check App Store Connect / TestFlight app after processing"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
